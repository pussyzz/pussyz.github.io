    function snowflakeCursor(color, options) {

            const svgIcons = [
                `
                <svg class="effect_snow_fake" width="1em" height="1em" fill="${color}" viewBox="0 0 50 50" version="1.2" baseProfile="tiny" xmlns="http://www.w3.org/2000/svg" overflow="inherit"><path d="M23 47.689v-6.342l-3.357 1.992L18 42.305v-2.229l5-2.986v-4.168l-4 2.451v-4.416l-4 2.094v5.99l-1.653 1.23L12 39.16v-4.012L6.426 38.27 4 37.271v-2.529l5.685-3.17L6 29.75v-2.32l2.123-1.127 5.214 3.068 3.612-2.084-.082-.065-3.665-2.123 3.568-2.228-3.577-2.083L7.98 23.84 6 22.871v-2.307l3.542-1.978L4 15.533v-2.529l2.321-1.114L12 15.087v-4.076l1.485-1.127 1.943 1.18-.056 6.105 3.673 2.122.033-4.311L23 17.079v-4.167l-5-2.988V7.71l1.643-1.05L23 8.652V2.324L24.994 1 27 2.324v6.328l3.906-2.031L33 7.84v1.992l-6 3.08v4.167l4-2.267v4.534l4-2.084v-6.524l1.455-.866 1.545.865v4.167l5.842-3.08L46 13.042v2.359l-5.495 3.17L44 20.525v2.254l-1.83.996-5.327-3.158-3.679 2.346 3.549 2.228-3.659 2.122 3.772 1.992 5.389-2.986L44 27.535v2.15l-3.32 1.887 5.32 3.17v2.49l-2.522 1.037L38 35.281v3.955l-1.52 1.049L35 39.236v-6.002l-4-2.213v4.168l-4-2.268v4.168l5 2.986v2.359l-1.647.904L27 41.348v6.342L24.994 49zm-1.466-22.597L23.42 28h3.514l1.613-2.908L26.843 22h-3.514z"/></svg>

        function createImageFromSVG(svgString) {
            const blob = new Blob([svgString], { type: "image/svg+xml" });
            const url = URL.createObjectURL(blob);

            this.update = function (context) {
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;
                this.lifeSpan--;

                this.velocity.x += ((Math.random() < 0.5 ? -1 : 1) * 2) / 75;
                this.velocity.y -= Math.random() / 300;

                const scale = Math.max(this.lifeSpan / this.initialLifeSpan, 0);

                const degrees = 2 * this.lifeSpan;
                const radians = degrees * 0.0174533;

                context.translate(this.position.x, this.position.y);
                context.rotate(radians);

                context.drawImage(
                    this.canv,
                    (-this.canv.width / 2) * scale,
                    -this.canv.height / 2,
                    this.canv.width * scale,
                    this.canv.height * scale
                );

                context.rotate(-radians);
                context.translate(-this.position.x, -this.position.y);
            };
        }

        init();

        return {
            destroy: destroy,
        };
    }

    function sparkingEffect(color = '#ffffff'){
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d", {
            alpha: true
        });
        document.body.appendChild(canvas);
        Object.assign(canvas.style, {
            position: "fixed",
            top: 0,
            left: 0,
            width: "100%",
            height: "100%",
            pointerEvents: "none",
            zIndex: 500
        });
        
        const dpr = window.devicePixelRatio || 1;
        let width = innerWidth,
            height = innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
        
        window.addEventListener("resize", () => {
            width = innerWidth;
            height = innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        });
        const stars = [];
        const maxStars = 500;
        
        class Star {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 1 + Math.random() * 1.2;
                this.life = 500 + Math.random() * 400;
                this.birth = performance.now();
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.4;
            }
            draw(now) {
                const age = now - this.birth;
                const alpha = 1 - age / this.life;
                if (alpha <= 0) return false;
                this.x += this.vx;
                this.y += this.vy;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                return true;
            }
        }
        
        function loop(now) {
            ctx.clearRect(0, 0, width, height);
            for (let i = stars.length - 1; i >= 0; i--) {
                if (!stars[i].draw(now)) stars.splice(i, 1);
            }
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
        document.addEventListener("mousemove", (e) => {
            for (let i = 0; i < 1; i++) {
                if (stars.length > maxStars) stars.shift();
                stars.push(new Star(e.clientX, e.clientY));
            }
        });
    }

                canvas.style.position = "fixed";
                document.body.appendChild(canvas);
                canvas.width = width;
                canvas.height = height;
            }

            bindEvents();
            loop();
        }

        function bindEvents() {
            element.addEventListener("mousemove", onMouseMove);
            element.addEventListener("touchmove", onTouchMove, { passive: true });
            element.addEventListener("touchstart", onTouchMove, { passive: true });
            window.addEventListener("resize", onWindowResize);
        }

            width = window.innerWidth;
            height = window.innerHeight;

            if (hasWrapperEl) {
                canvas.width = element.clientWidth;
                canvas.height = element.clientHeight;
            } else {
                canvas.width = width;
                canvas.height = height;
            }

                const boundingRect = element.getBoundingClientRect();
                cursor.x = e.clientX - boundingRect.left;
                cursor.y = e.clientY - boundingRect.top;
            } else {

            }

        }

                particles[i].update(context);

            element.removeEventListener("touchstart", onTouchMove);
            window.addEventListener("resize", onWindowResize);
        };

        /**
         * Particles
         */
                    function Particle(x, y, image) {
                this.initialLifeSpan = lifeSpan; // ms
                this.lifeSpan = lifeSpan; // ms

                this.update = function (context) {
                    this.lifeSpan--;
                    const opacity = Math.max(this.lifeSpan / this.initialLifeSpan, 0);

                    // Tính toán để căn giữa hình ảnh

                    context.drawImage(
                        this.image,
                        this.position.x - imageWidth / 2, // Căn giữa theo chiều ngang
                        this.position.y - imageHeight / 2 // Căn giữa theo chiều dọc
                    );
                };
            }
        
        init();

        return {
            destroy: destroy
        }
    }
